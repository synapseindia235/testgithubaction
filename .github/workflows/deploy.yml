name: Deploy Laravel App to EC2

on:
  push:
    branches:
      - dev
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    container:
      image: php:7.4-cli
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update && apt-get install -y zip unzip git libzip-dev libpng-dev pkg-config libsodium-dev libsodium23
          docker-php-ext-install zip pdo pdo_mysql gd sodium 
          curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
          composer install --no-dev --optimize-autoloader

      - name: Package
        run: zip -r deploy.zip . -x "*.git*" ".github/*" "tests/*"
      - name: Debug AWS_REGION secret
        run: |
            if [ -z "${{ secrets.AWS_REGION }}" ]; then
              echo "AWS_REGION secret is empty or not accessible!"
              exit 1
            else
              echo "AWS_REGION is set ✅"
            fi
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: aws s3 cp deploy.zip s3://awefilmstagebuild/deploy-${{ github.sha }}.zip
